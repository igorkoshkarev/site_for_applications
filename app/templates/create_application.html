<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новая заявка</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="card stack">
            <h1>Новая заявка</h1>
            <form class="stack" method="post" action="{{ url_for('create_application') }}">
                <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
                <div class="grid cols-2">
                    <div class="stack">
                        <label>Пользователь</label>
                        <input
                            type="text"
                            value="{{ user.full_name or user.username }}"
                            readonly
                        >
                    </div>
                    <div class="stack">
                        <label>Кабинет</label>
                        <input
                            type="text"
                            value="{{ user.cabinet or 'Не указан' }}"
                            readonly
                        >
                    </div>
                </div>
                <div class="stack">
                    <label>Тема</label>
                    <input type="text" name="title" required>
                </div>
                <div class="stack">
                    <label>Описание</label>
                    <textarea name="description" required></textarea>
                </div>
                <div class="row">
                    <a class="btn ghost" href="{{ url_for('get_applications') }}">Отмена</a>
                    <button class="btn primary" type="submit">Создать заявку</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
