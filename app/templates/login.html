<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page" style="max-width:420px; padding-top:80px;">
        <section class="card stack">
            <h1>Вход</h1>
            <form class="stack" method="post" action="{{ url_for('login_user') }}">
                <div class="stack">
                    <label>Логин</label>
                    <input type="text" name="username" required>
                </div>
                <div class="stack">
                    <label>Пароль</label>
                    <input type="password" name="password" required>
                </div>
                <button class="btn primary" type="submit">Войти</button>
            </form>
            <a class="btn ghost" href="{{ url_for('registration_page') }}">Регистрация</a>
        </section>
    </main>
</body>
</html>
