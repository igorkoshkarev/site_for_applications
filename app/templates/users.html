<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Пользователи</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="card stack">
            <div class="row">
                <h1>Пользователи</h1>
                <a class="btn primary" href="{{ url_for('registration_page') }}">+ Новый пользователь</a>
            </div>

            <form class="grid cols-2" method="GET" action="{{ url_for('get_all_users').include_query_params(limit=pagination.limit, page=pagination.next_page) }}">
                <input type="text" name="name" placeholder="Имя или email">
                <select name="role_name">
                    <option value="">Все роли</option>
                    {% for role in roles %}
                        <option value="{{ role.role }}">{{ role.russian_name }}</option>
                    {% endfor %}
                </select>
                <select name="cabinet">
                    <option value="">Все кабинеты</option>
                    {% for cabinet in cabinets %}
                        <option value="{{ cabinet.name }}">{{ cabinet.name }}</option>
                    {% endfor %}
                </select>
                <div class="row" style="justify-content:flex-end;">
                    <a class="btn ghost" href="{{ url_for('get_all_users') }}">Сбросить</a>
                    <button class="btn primary" type="submit">Найти</button>
                </div>
            </form>

            <div class="stack">
                {% for user in users %}
                <a class="list-link" href="{{ url_for('foreign_account', user_id=user.id) }}">
                    <div class="list-item row">
                        <div class="stack" style="gap:4px;">
                            <strong>{{ user.full_name }}</strong>
                            <span class="muted">{{ user.username }} • {{ user.email }} • {{ user.cabinet }}</span>
                        </div>
                        <span class="badge open">{{ user.role.russian_name }}</span>
                    </div>
                </a>
                {% endfor %}
            </div>

            {% include "pagination.html" %}
        </section>
    </main>
</body>
</html>
