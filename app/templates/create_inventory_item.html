<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Добавить инвентарь</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="card stack">
            <h1>Добавить инвентарь</h1>
            <form class="stack" action="{{ url_for('create_inventory') }}" method="post">
                <input type="hidden" name="csrf_token" value="{{ request.cookies.get('csrf_token', '') }}">
                <div class="grid cols-2">
                    <div class="stack">
                        <label>Инвентарный номер</label>
                        <input type="text" name="inventory_number" required>
                    </div>
                    <div class="stack">
                        <label>Название</label>
                        <input type="text" name="name" required>
                    </div>
                </div>

                <div class="grid cols-2">
                    <div class="stack">
                        <label>Статус</label>
                        <select name="status">
                            {% for st in status %}
                                <option value="{{ st.name }}">{{ st.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="stack">
                        <label>Кабинет</label>
                        <select name="cabinet_name" required>
                            {% for cabinet in cabinets %}
                                <option value="{{ cabinet.name }}">{{ cabinet.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="row">
                    <a class="btn ghost" href="{{ url_for('get_all_inventory') }}">Отмена</a>
                    <button class="btn primary" type="submit">Сохранить</button>
                </div>
            </form>
        </section>
    </main>
</body>
</html>
