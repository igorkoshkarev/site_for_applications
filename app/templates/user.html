<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="card stack">
            <h1>{{ account.full_name }}</h1>
            <div class="grid cols-2">
                <div class="card stack"><span class="muted">Логин</span><strong>{{ account.username }}</strong></div>
                <div class="card stack"><span class="muted">Email</span><strong>{{ account.email }}</strong></div>
                <div class="card stack"><span class="muted">Телефон</span><strong>{{ account.phone }}</strong></div>
                <div class="card stack"><span class="muted">Кабинет</span><strong>{{ account.cabinet }}</strong></div>
            </div>
        </section>

        <section class="card stack">
            <h2>Заявки пользователя</h2>
            {% for a in account.applications %}
                <a class="list-link" href="{{ url_for('get_application', application_id=a.id) }}">
                    <div class="list-item">#{{ a.id }} — {{ a.title }}</div>
                </a>
            {% else %}
                <p class="muted">Заявок нет</p>
            {% endfor %}
        </section>
    </main>
</body>
</html>
