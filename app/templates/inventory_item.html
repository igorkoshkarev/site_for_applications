<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточка инвентаря</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="card stack">
            <div class="row">
                <h1>{{ item.name }}</h1>
                <span class="badge open">{{ item.status }}</span>
            </div>

            <div class="grid cols-2">
                <div class="card stack">
                    <span class="muted">Инвентарный номер</span>
                    <strong>{{ item.inventory_number }}</strong>
                </div>
                <div class="card stack">
                    <span class="muted">Кабинет</span>
                    <strong>{{ item.cabinet_name }}</strong>
                </div>
            </div>

            <a class="btn ghost" href="{{ url_for('get_all_inventory') }}">← К списку инвентаря</a>
        </section>
    </main>
</body>
</html>
