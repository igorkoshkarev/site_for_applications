<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page stack">
        {% include "header.html" %}

        <section class="tile-grid">
            <a class="tile" href="{{ url_for('get_applications') }}">
                <article class="card stack">
                    <h3>Заявки</h3>
                    <p class="muted">Просмотр и обработка заявок</p>
                </article>
            </a>
            <a class="tile" href="{{ url_for('get_all_inventory') }}">
                <article class="card stack">
                    <h3>Инвентарь</h3>
                    <p class="muted">Склад и оборудование</p>
                </article>
            </a>
            <a class="tile" href="{{ url_for('get_all_users') }}">
                <article class="card stack">
                    <h3>Пользователи</h3>
                    <p class="muted">Сотрудники и профили</p>
                </article>
            </a>
        </section>
    </main>
</body>
</html>
