<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация</title>
    <link rel="stylesheet" href="{{ url_for('static', path='site.css') }}">
</head>
<body>
    <main class="page" style="max-width:760px; padding-top:40px;">
        <section class="card stack">
            <div class="row">
                <h1>Регистрация</h1>
                <a class="btn ghost" href="{{ url_for('get_all_users') }}">Назад</a>
            </div>

            <form class="stack" method="post" action="{{ url_for('create_user') }}">
                <div class="grid cols-2">
                    <div class="stack">
                        <label>Логин</label>
                        <input type="text" name="username" required>
                    </div>
                    <div class="stack">
                        <label>ФИО</label>
                        <input type="text" name="full_name" required>
                    </div>
                    <div class="stack">
                        <label>Email</label>
                        <input type="email" name="email" required>
                    </div>
                    <div class="stack">
                        <label>Телефон</label>
                        <input type="tel" name="phone" required>
                    </div>
                    <div class="stack">
                        <label>Кабинет</label>
                        <select name="cabinet" required>
                            {% for cabinet in cabinets %}
                                <option value="{{ cabinet.name }}">{{ cabinet.name }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="stack">
                        <label>Пароль</label>
                        <input type="password" name="password" required>
                    </div>
                </div>
                <div class="stack">
                    <label>Повтор пароля</label>
                    <input type="password" name="verify_password" required>
                </div>

                <button class="btn primary" type="submit">Создать пользователя</button>
            </form>
        </section>
    </main>
</body>
</html>
